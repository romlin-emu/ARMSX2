[tools]
hk = "2.12.0"
python = "3.14.10"
cmake = "4.4.5"
ninja = "1.13.2"
actionlint = "1.7.12"

[tasks.check]
description = "Run the repository's documented check scripts"
depends = ["check:textures", "check:workflows"]

[tasks."check:textures"]
description = "Libretro texture-loading checks (needs a C++ compiler)"
run = "python3 tests/libretro-textures/check.py"

[tasks."check:workflows"]
description = "Release workflow script checks"
run = "python3 tests/workflows/check.py"

[tasks.hooks]
description = "Run hk hygiene checks on all scoped files"
run = "hk check --all"
