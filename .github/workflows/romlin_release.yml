name: Romlin core release

# Builds the macOS arm64 libretro core that Romlin downloads for PS2 games, and
# publishes it as a release named after the commit it was built from.

on:
  push:
    branches: [romlin]
  pull_request:
    branches: [romlin]
  workflow_dispatch:

permissions: {}

concurrency:
  group: romlin-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-textures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/libretro-textures/check.py
      - run: python3 tests/workflows/check.py

  macos:
    name: macOS arm64 core
    uses: ./.github/workflows/macos_build_libretro.yml # zizmor: ignore[self-repository] standard local workflow reference
    permissions:
      contents: read
    with:
      jobName: "libretro Core Build (macOS arm64)"
      artifactPrefixName: "armsx2-macos-arm64-libretro"
      fetchTags: true

  publish:
    if: >-
      github.repository == 'romlin-emu/ARMSX2' &&
      github.ref == 'refs/heads/romlin' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Publish release
    needs: [check-textures, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
          pattern: armsx2-macos-arm64-libretro-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="core-$(date -u +%Y%m%d)-${GITHUB_SHA::10}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          asset=armsx2_libretro-macos-arm64.zip
          shopt -s nullglob
          archives=(dl/*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one macOS arm64 core ZIP, found ${#archives[@]}"
            exit 1
          fi
          cp "${archives[0]}" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$tag" "$asset" "$asset.sha256" \
            --target "$GITHUB_SHA" \
            --title "ARMSX2 libretro core, ${GITHUB_SHA::10}" \
            --notes "The ARMSX2 libretro core for Apple Silicon Macs, built from ${GITHUB_SHA::10} on the romlin branch. It renders through the frontend's Vulkan device and links only system libraries." \
            --latest
